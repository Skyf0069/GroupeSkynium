<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HTFISS — Groupe Skynium</title>
    <meta name="description" content="Les branches, sous-branches et marques du Groupe Skynium, et les liens qui les relient.">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#1D0469">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'none';
        script-src  'self' 'unsafe-inline' https://skynium.fr https://api.nexus.skynium.fr;
        style-src   'self' 'unsafe-inline' https://skynium.fr;
        font-src    https://skynium.fr data:;
        img-src     https://skynium.fr https://api.nexus.skynium.fr data:;
        connect-src https://api.nexus.skynium.fr;
        manifest-src https://skynium.fr;
        form-action 'none'; base-uri 'none'; object-src 'none';
        upgrade-insecure-requests;">
    <link rel="stylesheet" href="https://skynium.fr/ressources/style.css">
    <link rel="stylesheet" href="https://skynium.fr/ressources/fontawesome/css/all.min.css">
    <link rel="icon" type="image/png" href="https://skynium.fr/ressources/favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="https://skynium.fr/ressources/favicon/favicon.svg"/>
    <meta name="apple-mobile-web-app-title" content="Groupe Skynium"/>
    <style>
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        *, *::before, *::after { box-sizing: border-box; }
        body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

        .ht { max-width: 1040px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
        .ht-head { text-align: center; margin-bottom: 3rem; }
        .ht-head h1 { color: var(--primary); font-size: 2.2rem; margin: 0 0 .8rem; line-height: 1.2; }
        .ht-head .accroche { color: #666; font-size: 1.05rem; line-height: 1.7; margin: 0 auto; max-width: 640px; }

        .branche { margin-bottom: 3.5rem; }
        .branche-tete { display: flex; align-items: center; gap: 16px; padding: 1.4rem 1.6rem;
            border-radius: 16px; color: #fff; margin-bottom: 1.4rem; flex-wrap: wrap; }
        .branche-tete .ic { width: 52px; height: 52px; border-radius: 13px;
            background: rgba(255,255,255,.18); display: flex; align-items: center;
            justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .branche-tete .b { flex: 1; min-width: 200px; }
        .branche-tete h2 { margin: 0; font-size: 1.45rem; color: #fff; }
        .branche-tete .a { font-size: .93rem; opacity: .9; margin-top: 3px; line-height: 1.55; }
        .branche-tete .lien-site { background: rgba(255,255,255,.2); color: #fff;
            padding: 8px 16px; border-radius: 50px; text-decoration: none; font-size: .84rem;
            font-weight: 600; white-space: nowrap; }
        .branche-tete .lien-site:hover { background: rgba(255,255,255,.32); }

        .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; }
        .carte { border-radius: 13px; border: 1px solid #eee; padding: 1.15rem 1.25rem;
            background: #fff; border-left-width: 4px; border-left-style: solid;
            transition: transform .18s, box-shadow .18s; }
        .carte:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.07); }
        .carte h3 { margin: 0 0 .3rem; font-size: 1rem; color: var(--primary);
            display: flex; align-items: center; gap: 8px; }
        .carte h3 .ic { font-size: .9rem; opacity: .75; }
        .carte .a { font-size: .85rem; color: #777; line-height: 1.6; margin: 0 0 .7rem; }
        .carte .meta { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .6rem; }
        .carte .liens { border-top: 1px solid #f4f4f4; padding-top: .65rem; margin-top: .65rem; }
        .carte .lien-l { display: flex; gap: 7px; align-items: baseline;
            font-size: .79rem; color: #666; line-height: 1.55; margin-bottom: .3rem; }
        .carte .lien-l .lb { font-weight: 700; white-space: nowrap; }
        .carte .lien-l .note { color: #bbb; font-style: italic; }
        .carte .url { display: inline-block; margin-top: .6rem; font-size: .82rem;
            text-decoration: none; font-weight: 600; }

        .sous { margin: .8rem 0 0 0; padding: .75rem 0 0; border-top: 1px dashed #eee; }
        .sous-t { font-size: .68rem; text-transform: uppercase; letter-spacing: 1px;
            color: #bbb; margin-bottom: .45rem; font-weight: 700; }
        .sous-l { display: flex; flex-wrap: wrap; gap: .3rem; }
        .puce { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
            border-radius: 50px; font-size: .76rem; font-weight: 600; color: #fff; }

        .badge { display: inline-block; padding: 2px 9px; border-radius: 50px;
            font-size: .68rem; font-weight: 700; }

        .legende { background: #fafafa; border-radius: 14px; padding: 1.5rem 1.7rem; margin: 3rem 0; }
        .legende h2 { font-size: 1.05rem; color: var(--primary); margin: 0 0 .4rem; }
        .legende > p { font-size: .88rem; color: #777; line-height: 1.65; margin: 0 0 1.2rem; }
        .legende-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .8rem; }
        .legende-item { display: flex; gap: 11px; align-items: flex-start; }
        .legende-item .ic { width: 30px; height: 30px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; font-size: .82rem; flex-shrink: 0; }
        .legende-item .n { font-size: .85rem; font-weight: 700; color: var(--primary); }
        .legende-item .d { font-size: .78rem; color: #999; line-height: 1.5; margin-top: 1px; }

        .ht-note { text-align: center; color: #bbb; font-size: .82rem; margin-top: 3rem; line-height: 1.7; }
        .ht-etat { text-align: center; padding: 4rem 1.5rem; color: #aaa; }
        .ht-etat i { font-size: 2.5rem; display: block; margin-bottom: 1rem; color: #ddd; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ht-etat .spin { animation: spin 1s linear infinite; color: var(--secondary); }

        @media (max-width: 640px) {
            .ht { padding: 2rem 1.1rem 3rem; }
            .ht-head h1 { font-size: 1.65rem; }
            .branche-tete { padding: 1.1rem 1.2rem; gap: 12px; }
            .branche-tete h2 { font-size: 1.2rem; }
            .grille { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .carte { transition: none; }
            .carte:hover { transform: none; }
        }
        @media print {
            header, footer { display: none !important; }
            .carte:hover { transform: none; box-shadow: none; }
            .branche { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <header role="banner">
        <div><img src="https://skynium.fr/ressources/logo.png" alt="Groupe Skynium"><a href="/"><p>GROUPE SKYNIUM</p></a></div>
        <nav role="navigation" aria-label="Navigation principale">
            <button id="mobile-menu-icon" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        </nav>
    </header>
    <main id="main-content" role="main">
        <div class="ht">
            <div class="ht-head">
                <h1 id="ht-titre">How The F*ck Is Skynium Structured</h1>
                <p class="accroche" id="ht-accroche">Chargement…</p>
            </div>
            <div id="ht-zone">
                <div class="ht-etat"><i class="fa-solid fa-circle-notch spin"></i>Chargement de la structure…</div>
            </div>
        </div>
    </main>
    <script>
    (function () {
        'use strict';
        var API = 'https://api.nexus.skynium.fr';

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function coul(v) {
            return /^#[0-9A-Fa-f]{3,8}$/.test(String(v || '')) ? String(v) : '#1D0469';
        }
        function $(id) { return document.getElementById(id); }

        function contraste(hex) {
            var h = String(hex).replace('#', '');
            if (h.length === 3) h = h.split('').map(function (x) { return x + x; }).join('');
            if (h.length < 6) return '#fff';
            var r = parseInt(h.slice(0, 2), 16),
                v = parseInt(h.slice(2, 4), 16),
                b = parseInt(h.slice(4, 6), 16);
            return (r * 299 + v * 587 + b * 114) / 1000 > 150 ? '#1a1a1a' : '#fff';
        }

        function blocLiens(e, index) {
            var tous = (e.liens.sortants || []).concat(e.liens.entrants || []);
            if (!tous.length) return '';

            return '<div class="liens">' + tous.map(function (l) {
                var autre = index[l.vers];
                if (!autre) return '';
                return '<div class="lien-l">' +
                    '<span class="lb" style="color:' + coul(l.couleur) + ';">' +
                        (l.icone ? '<i class="fa-solid ' + esc(l.icone) + '"></i> ' : '') +
                        esc(l.label) + '</span>' +
                    '<span>' + esc(autre.nom) +
                    (l.note ? ' <span class="note">— ' + esc(l.note) + '</span>' : '') +
                    '</span></div>';
            }).join('') + '</div>';
        }

        function blocSous(e, enfantsDe) {
            var enfants = enfantsDe[e.id] || [];
            if (!enfants.length) return '';
            return '<div class="sous"><div class="sous-t">' +
                (enfants.length > 1 ? 'Contient' : 'Contient') + '</div>' +
                '<div class="sous-l">' + enfants.map(function (c) {
                    var bg = coul(c.couleur);
                    return '<span class="puce" style="background:' + bg + ';color:' +
                        contraste(bg) + ';">' +
                        (c.icone ? '<i class="fa-solid ' + esc(c.icone) + '"></i>' : '') +
                        esc(c.nom) + '</span>';
                }).join('') + '</div></div>';
        }

        function carte(e, index, enfantsDe) {
            var c = coul(e.couleur);
            return '<article class="carte" style="border-left-color:' + c + ';">' +
                '<h3>' + (e.icone ? '<span class="ic" style="color:' + c +
                    ';"><i class="fa-solid ' + esc(e.icone) + '"></i></span>' : '') +
                    esc(e.nom) + '</h3>' +
                '<div class="meta">' +
                    '<span class="badge" style="background:' + c + '1a;color:' + c + ';">' +
                        esc(e.nature_label) + '</span>' +
                    '<span class="badge" style="background:' + coul(e.statut_couleur) +
                        '1a;color:' + coul(e.statut_couleur) + ';">' +
                        esc(e.statut_label) + '</span>' +
                '</div>' +
                (e.accroche ? '<p class="a">' + esc(e.accroche) + '</p>' : '') +
                blocSous(e, enfantsDe) +
                blocLiens(e, index) +
                (e.url ? '<a class="url" style="color:' + c + ';" href="' + esc(e.url) +
                    '" rel="noopener">' + esc(e.url_libelle || 'Voir le site') +
                    ' <i class="fa-solid fa-arrow-right"></i></a>' : '') +
            '</article>';
        }

        function legende(d) {
            var employes = {};
            d.entites.forEach(function (e) {
                (e.liens.sortants || []).forEach(function (l) { employes[l.type] = true; });
            });
            var types = d.types_lien.filter(function (t) { return employes[t.code]; });
            if (!types.length) return '';

            return '<section class="legende">' +
                '<h2>Ce que veulent dire les liens</h2>' +
                '<p>Les marques du Groupe ne se rangent pas toutes sous la même branche, ' +
                'mais elles se servent les unes des autres. Voici comment se lisent ces ' +
                'relations.</p>' +
                '<div class="legende-grille">' + types.map(function (t) {
                    var c = coul(t.couleur);
                    return '<div class="legende-item">' +
                        '<span class="ic" style="background:' + c + '1a;color:' + c + ';">' +
                            '<i class="fa-solid ' + esc(t.icone || 'fa-link') + '"></i></span>' +
                        '<div><div class="n">' + esc(t.actif) +
                            (t.actif !== t.passif ? ' · ' + esc(t.passif) : '') + '</div>' +
                        (t.description ? '<div class="d">' + esc(t.description) + '</div>' : '') +
                        '</div></div>';
                }).join('') + '</div></section>';
        }

        function rendre(d) {
            if (d.titre) $('ht-titre').textContent = d.titre;
            $('ht-accroche').textContent = d.accroche || '';

            var index = {};
            var enfantsDe = {};
            d.entites.forEach(function (e) {
                index[e.id] = e;
                if (e.parent_id) (enfantsDe[e.parent_id] = enfantsDe[e.parent_id] || []).push(e);
            });

            var racines = d.entites.filter(function (e) { return !e.parent_id; });
            if (!racines.length) {
                $('ht-zone').innerHTML = '<div class="ht-etat">' +
                    '<i class="fa-regular fa-folder-open"></i>La structure sera publiée bientôt.</div>';
                return;
            }

            var html = racines.map(function (b) {
                var c = coul(b.couleur);
                var texte = contraste(c);
                var directs = enfantsDe[b.id] || [];

                return '<section class="branche">' +
                    '<div class="branche-tete" style="background:' + c + ';color:' + texte + ';">' +
                        '<span class="ic">' +
                            '<i class="fa-solid ' + esc(b.icone || 'fa-code-branch') + '"></i></span>' +
                        '<div class="b"><h2 style="color:' + texte + ';">' + esc(b.nom) + '</h2>' +
                        (b.accroche ? '<div class="a">' + esc(b.accroche) + '</div>' : '') + '</div>' +
                        '<span class="badge" style="background:rgba(255,255,255,.22);color:' +
                            texte + ';">' + esc(b.statut_label) + '</span>' +
                        (b.url ? '<a class="lien-site" href="' + esc(b.url) + '" rel="noopener">' +
                            esc(b.url_libelle || 'Visiter') + '</a>' : '') +
                    '</div>' +
                    (directs.length
                        ? '<div class="grille">' + directs.map(function (e) {
                            return carte(e, index, enfantsDe);
                          }).join('') + '</div>'
                        : '<p style="color:#bbb;font-size:.9rem;padding:.5rem 0;">' +
                          'Rien de publié sous cette branche pour le moment.</p>') +
                    ((b.liens.sortants.length || b.liens.entrants.length)
                        ? '<div class="carte" style="border-left-color:' + c +
                          ';margin-top:1rem;"><h3 style="font-size:.9rem;">' +
                          'Liens de la branche</h3>' + blocLiens(b, index) + '</div>'
                        : '') +
                '</section>';
            }).join('');

            html += legende(d);
            html += '<p class="ht-note">Cette page est construite depuis Skynium NEXUS.<br>' +
                'Elle reflète la structure telle qu\u2019elle est enregistrée, ' +
                'pas telle qu\u2019on aimerait la présenter.</p>';

            $('ht-zone').innerHTML = html;
        }

        function charger() {
            fetch(API + '/htfiss/structure', { credentials: 'omit' })
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (d) {
                    if (!d || !d.actif) {
                        $('ht-zone').innerHTML = '<div class="ht-etat">' +
                            '<i class="fa-regular fa-clock"></i>Cette page sera bientôt disponible.</div>';
                        $('ht-accroche').textContent = '';
                        return;
                    }
                    rendre(d);
                })
                .catch(function () {
                    $('ht-zone').innerHTML = '<div class="ht-etat">' +
                        '<i class="fa-solid fa-triangle-exclamation"></i>' +
                        'Structure momentanément indisponible. Réessayez dans un instant.</div>';
                    $('ht-accroche').textContent = '';
                });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', charger);
        } else charger();
    })();
    </script>
    <script src="https://api.nexus.skynium.fr/unify/unify.js" defer></script>
</body>
</html>
